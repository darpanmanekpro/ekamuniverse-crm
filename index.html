<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="google" content="notranslate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EkamUniverse CRM" />
    <meta name="application-name" content="EkamUniverse CRM" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="40x40" href="./appIcon/40.png" />
    <link rel="apple-touch-icon" sizes="58x58" href="./appIcon/58.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="./appIcon/60.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="./appIcon/76.png" />
    <link rel="apple-touch-icon" sizes="80x80" href="./appIcon/80.png" />
    <link rel="apple-touch-icon" sizes="87x87" href="./appIcon/87.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="./appIcon/114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="./appIcon/120.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="./appIcon/128.png" />
    <link rel="apple-touch-icon" sizes="136x136" href="./appIcon/136.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./appIcon/152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./appIcon/167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./appIcon/180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./appIcon/192.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="./appIcon/1024.png" />
    <title>EkamUniverse CRM</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      /* Prevent accidental double-tap zoom on interactive elements */
      button,
      input,
      select,
      textarea,
      a {
        touch-action: manipulation;
      }

      .loader-container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: #fafafa;
      }

      /* CSS Spinner from https://projects.lukehaas.me/css-loaders/ */

      .loader,
      .loader:before,
      .loader:after {
        border-radius: 50%;
      }

      .loader {
        color: #283593;
        font-size: 11px;
        text-indent: -99999em;
        margin: 55px auto;
        position: relative;
        width: 10em;
        height: 10em;
        box-shadow: inset 0 0 0 1em;
        -webkit-transform: translateZ(0);
        -ms-transform: translateZ(0);
        transform: translateZ(0);
      }

      .loader:before,
      .loader:after {
        position: absolute;
        content: "";
      }

      .loader:before {
        width: 5.2em;
        height: 10.2em;
        background: #fafafa;
        border-radius: 10.2em 0 0 10.2em;
        top: -0.1em;
        left: -0.1em;
        -webkit-transform-origin: 5.2em 5.1em;
        transform-origin: 5.2em 5.1em;
        -webkit-animation: load2 2s infinite ease 1.5s;
        animation: load2 2s infinite ease 1.5s;
      }

      .loader:after {
        width: 5.2em;
        height: 10.2em;
        background: #fafafa;
        border-radius: 0 10.2em 10.2em 0;
        top: -0.1em;
        left: 5.1em;
        -webkit-transform-origin: 0px 5.1em;
        transform-origin: 0px 5.1em;
        -webkit-animation: load2 2s infinite ease;
        animation: load2 2s infinite ease;
      }

      @-webkit-keyframes load2 {
        0% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }

        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }

      @keyframes load2 {
        0% {
          -webkit-transform: rotate(0deg);
          transform: rotate(0deg);
        }

        100% {
          -webkit-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="loader-container">
        <div class="loader">Loading...</div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      (function () {
        // Handle PKCE flow: Supabase redirects with ?code=xxx as a query param
        var search = window.location.search;
        if (search && search.indexOf("code=") !== -1) {
          var qp = new URLSearchParams(search);
          var code = qp.get("code");
          if (code) {
            // Replace the full URL to remove ?code= from the query string
            // and route into the SPA's set-password page
            window.location.replace(
              window.location.origin +
                window.location.pathname +
                "#/set-password?code=" +
                encodeURIComponent(code),
            );
            return; // stop further execution
          }
        }

        // Handle implicit flow: Supabase redirects with #access_token=xxx
        var hash = window.location.hash;
        if (
          hash &&
          hash.indexOf("access_token=") !== -1 &&
          !hash.startsWith("#/")
        ) {
          var params = new URLSearchParams(hash.substring(1));
          var access_token = params.get("access_token");
          var refresh_token = params.get("refresh_token");
          var type = params.get("type");
          if (access_token) {
            window.location.hash =
              "/set-password?access_token=" +
              encodeURIComponent(access_token) +
              "&refresh_token=" +
              encodeURIComponent(refresh_token || "") +
              "&type=" +
              encodeURIComponent(type || "");
          }
        }
      })();
    </script>
    <script type="module" src="<%= mainScript %>"></script>
  </body>
</html>
