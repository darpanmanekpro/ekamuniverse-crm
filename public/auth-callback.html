<!doctype html>
<html lang="en" translate="no" class="notranslate">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="minimum-scale=1, initial-scale=1, width=device-width, shrink-to-fit=no"
        />
        <meta name="theme-color" content="#000000" />
        <meta name="google" content="notranslate" />
        <link rel="manifest" href="./manifest.json" />
        <link rel="shortcut icon" href="./favicon.ico" />
        <title>EkamUniverse CRM</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: sans-serif;
            }

            .loader-container {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: #fafafa;
            }

            /* CSS Spinner from https://projects.lukehaas.me/css-loaders/ */

            .loader,
            .loader:before,
            .loader:after {
                border-radius: 50%;
            }

            .loader {
                color: #283593;
                font-size: 11px;
                text-indent: -99999em;
                margin: 55px auto;
                position: relative;
                width: 10em;
                height: 10em;
                box-shadow: inset 0 0 0 1em;
                -webkit-transform: translateZ(0);
                -ms-transform: translateZ(0);
                transform: translateZ(0);
            }

            .loader:before,
            .loader:after {
                position: absolute;
                content: '';
            }

            .loader:before {
                width: 5.2em;
                height: 10.2em;
                background: #fafafa;
                border-radius: 10.2em 0 0 10.2em;
                top: -0.1em;
                left: -0.1em;
                -webkit-transform-origin: 5.2em 5.1em;
                transform-origin: 5.2em 5.1em;
                -webkit-animation: load2 2s infinite ease 1.5s;
                animation: load2 2s infinite ease 1.5s;
            }

            .loader:after {
                width: 5.2em;
                height: 10.2em;
                background: #fafafa;
                border-radius: 0 10.2em 10.2em 0;
                top: -0.1em;
                left: 5.1em;
                -webkit-transform-origin: 0px 5.1em;
                transform-origin: 0px 5.1em;
                -webkit-animation: load2 2s infinite ease;
                animation: load2 2s infinite ease;
            }

            @-webkit-keyframes load2 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }

            @keyframes load2 {
                0% {
                    -webkit-transform: rotate(0deg);
                    transform: rotate(0deg);
                }
                100% {
                    -webkit-transform: rotate(360deg);
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <noscript> You need to enable JavaScript to run this app. </noscript>
        <div id="root">
            <div class="loader-container">
                <div class="loader">Loading...</div>
            </div>
        </div>
    </body>
    <script>
        const getUrlParams = () => {
            let hash = window.location.hash;
            if (hash && hash.startsWith('#')) {
                hash = hash.substring(1);
            }
            let urlSearchParams = new URLSearchParams(hash);
            let access_token = urlSearchParams.get('access_token');
            let refresh_token = urlSearchParams.get('refresh_token');
            let type = urlSearchParams.get('type');
            let code = urlSearchParams.get('code');
            let token_hash = urlSearchParams.get('token_hash');

            if (!access_token && !code && !token_hash) {
                urlSearchParams = new URLSearchParams(window.location.search);
                access_token = urlSearchParams.get('access_token');
                refresh_token = urlSearchParams.get('refresh_token');
                type = urlSearchParams.get('type');
                code = urlSearchParams.get('code');
                token_hash = urlSearchParams.get('token_hash');
            }

            return { access_token, refresh_token, type, code, token_hash };
        };

        function interceptAuthCallback() {
            const { access_token, refresh_token, type, code, token_hash } = getUrlParams();
            // Get root path without auth-callback.html
            const pathname = window.location.pathname.replace(/\/+auth-callback\.html.*$/, '/');
            const rootUrl = window.location.origin + (pathname.endsWith('/') ? pathname : pathname + '/');

            if (access_token) {
                window.location.replace(`${rootUrl}#/set-password?access_token=${encodeURIComponent(access_token)}&refresh_token=${encodeURIComponent(refresh_token || '')}&type=${encodeURIComponent(type || 'invite')}`);
            } else if (code) {
                window.location.replace(`${rootUrl}#/set-password?code=${encodeURIComponent(code)}&type=${encodeURIComponent(type || 'invite')}`);
            } else if (token_hash) {
                window.location.replace(`${rootUrl}#/set-password?token_hash=${encodeURIComponent(token_hash)}&type=${encodeURIComponent(type || 'invite')}`);
            } else {
                window.location.replace(`${rootUrl}#/login`);
            }
        }
    
        // Call the function to intercept the auth callback
        interceptAuthCallback();
    </script>
</html>
